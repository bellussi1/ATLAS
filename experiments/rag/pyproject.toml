[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rag"
version = "0.1.0"
description = "Experimento isolado de busca semântica, RAG com citações, avaliação e mineração do acervo para o ATLAS."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "accelerate>=0.34.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "rank-bm25>=0.2.2",
    "scipy>=1.13.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
atlas-rag = "atlas_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
