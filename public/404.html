<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — ATLAS</title>
    <link rel="icon" href="/atlas-mark.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: 'Source Serif 4';
        src: url('/fonts/SourceSerif4.woff2') format('woff2');
        font-weight: 200 900;
        font-display: swap;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #fbf8f1;
        color: #141211;
        font-family: 'Source Serif 4', Georgia, serif;
        line-height: 1.5;
      }
      main {
        width: min(100%, 40rem);
      }
      .code {
        margin: 0;
        font:
          700 clamp(4rem, 18vw, 8rem) / 1 system-ui,
          sans-serif;
        color: #b81d16;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0.5rem 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.15;
      }
      p {
        margin: 0 0 1.5rem;
        color: #57544d;
        font-size: 1.125rem;
      }
      ul {
        display: grid;
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.875rem 1rem;
        border: 1px solid #777268;
        color: inherit;
        text-decoration: none;
        background: #fffdfa;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }
      a:hover {
        background: #e9e4da;
        border-color: #141211;
        transform: translateX(4px);
      }
      a:focus-visible {
        outline: 3px solid #b81d16;
        outline-offset: 2px;
      }
      a small {
        color: #57544d;
        font-size: 0.9375rem;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
        a:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>Este endereço não existe no acervo. Escolha um dos caminhos abaixo.</p>
      <nav aria-label="Caminhos sugeridos">
        <ul>
          <li>
            <a href="/marxismo">Marxismo <small>Leitura da tradição</small></a>
          </li>
          <li>
            <a href="/liberalismo">Liberalismo <small>Leitura exploratória</small></a>
          </li>
          <li>
            <a href="/acervo">Acervo <small>Todos os registros</small></a>
          </li>
          <li>
            <a href="/">Início <small>Voltar à abertura</small></a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
