<form (submit)="check($event)">
  <fieldset>
    <legend>{{ exercise().prompt }}</legend>
    @for (option of exercise().options; track option.id) {
      <label
        ><input type="radio" name="answer" [value]="option.id" (change)="choice.set(option.id)" />
        {{ option.text }}</label
      >
    }
  </fieldset>
  <button type="submit">Conferir resposta</button>
</form>
@if (feedback()) {
  <p class="feedback" role="status">
    {{ feedback() }}
    <a [routerLink]="sourceLink()">Conferir fonte</a>
  </p>
}
