@if (picture(); as src) {
  <img class="card-picture" [src]="src" alt="" loading="lazy" />
} @else {
  <app-kind-icon class="card-glyph" [kind]="icon()" />
}
<small class="card-kind"><app-kind-icon [kind]="icon()" />{{ kindLabel() }}</small>
<strong>{{ title() }}</strong>
@if (period()) {
  <span class="card-period">{{ period() }}</span>
}
@if (note()) {
  <span class="card-links">{{ note() }}</span>
}
