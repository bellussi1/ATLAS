@if (license(); as record) {
  @if (kind() === 'image') {
    <figure>
      <img
        [src]="record.assetPath | contentMedia"
        [alt]="alt()"
        [attr.loading]="loading()"
        [attr.fetchpriority]="fetchPriority()"
      />
      @if (credit()) {
        <figcaption>
          {{ creator(record) }}
          <a [href]="record.licenseUrl" target="_blank" rel="noopener noreferrer">{{
            record.license
          }}</a>
        </figcaption>
      }
    </figure>
  } @else {
    <p>
      <a [href]="record.assetPath | contentMedia">{{ alt() }}</a> · {{ creator(record) }}
      <a [href]="record.licenseUrl" target="_blank" rel="noopener noreferrer">{{
        record.license
      }}</a>
    </p>
  }
} @else {
  <p class="license-block" role="note">
    Ativo omitido: licença desconhecida ou reprodução não autorizada.
  </p>
}
