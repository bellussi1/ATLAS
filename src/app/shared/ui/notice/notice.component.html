<div
  class="atlas-notice"
  [class.atlas-notice--success]="tone() === 'success'"
  [class.atlas-notice--warning]="tone() === 'warning'"
  [class.atlas-notice--critical]="tone() === 'critical'"
  [attr.role]="accessibleRole()"
  [attr.aria-live]="accessibleRole() === 'alert' ? 'assertive' : 'polite'"
>
  <ng-content />
</div>
