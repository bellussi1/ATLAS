@if (breadcrumbs().length > 1) {
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
      @for (item of breadcrumbs(); track item.url + item.label) {
        <li>
          @if (item.current) {
            <span aria-current="page">{{ item.label }}</span>
          } @else {
            <a [routerLink]="item.url">{{ item.label }}</a>
          }
        </li>
      }
    </ol>
  </nav>
}
