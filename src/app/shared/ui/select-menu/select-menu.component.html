<div class="select-menu">
  <button
    #trigger
    type="button"
    class="select-menu__trigger"
    [id]="triggerId"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-labelledby]="labelledBy() + ' ' + triggerId"
    (click)="toggle()"
    (keydown)="onTriggerKey($event)"
  >
    <span class="select-menu__value">{{ selected().label }}</span>
    <span class="select-menu__chevron" aria-hidden="true"></span>
  </button>
  @if (open()) {
    <ul
      class="select-menu__list"
      role="listbox"
      tabindex="-1"
      [attr.aria-labelledby]="labelledBy()"
    >
      @for (option of options(); track option.value; let i = $index) {
        <li
          #item
          class="select-menu__option"
          role="option"
          tabindex="-1"
          [attr.aria-selected]="option.value === value()"
          (click)="choose(i)"
          (keydown)="onListKey($event)"
        >
          <span>{{ option.label }}</span>
          @if (option.count !== undefined) {
            <span class="select-menu__count">{{ option.count }}</span>
          }
        </li>
      }
    </ul>
  }
</div>
