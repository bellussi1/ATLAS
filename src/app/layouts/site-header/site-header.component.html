<header class="site-header">
  <div class="site-header__inner">
    <a
      class="wordmark"
      routerLink="/"
      (click)="close()"
      aria-label="ATLAS — História em relação — página inicial"
    >
      <img class="wordmark__logo" src="/brand/atlas-logo.svg" alt="" width="280" height="80" />
      <span class="wordmark__caption">História em relação</span>
    </a>
    <button
      #menuToggle
      type="button"
      class="menu-toggle atlas-press"
      aria-controls="navegacao-principal"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      <span class="menu-toggle__icon" aria-hidden="true"></span>
      <span>Menu</span>
    </button>
    <nav
      id="navegacao-principal"
      class="graphic-doors"
      [class.is-open]="menuOpen()"
      aria-label="Navegação principal"
    >
      <a
        class="graphic-door atlas-press"
        routerLink="/marxismo"
        [class.is-active]="section() === 'marxismo'"
        [attr.aria-current]="section() === 'marxismo' ? 'page' : null"
        (click)="close()"
      >
        <app-geometric-mosaic [columns]="3" [rows]="1" palette="marx" [seed]="11" />
        <span class="door-verb">Ler </span>
        <span class="door-label"
          >Marxismo <span class="atlas-arrow" aria-hidden="true">↗</span></span
        >
      </a>
      <a
        class="graphic-door atlas-press"
        routerLink="/liberalismo"
        [class.is-active]="section() === 'liberalismo'"
        [attr.aria-current]="section() === 'liberalismo' ? 'page' : null"
        (click)="close()"
      >
        <app-geometric-mosaic [columns]="3" [rows]="1" palette="liberal" [seed]="23" />
        <span class="door-verb">Percorrer </span>
        <span class="door-label"
          >Liberalismo <span class="atlas-arrow" aria-hidden="true">↗</span></span
        >
      </a>
      <a
        class="graphic-door graphic-door--search atlas-press"
        routerLink="/conhecimento"
        [class.is-active]="section() === 'acervo'"
        [attr.aria-current]="section() === 'acervo' ? 'page' : null"
        (click)="close()"
      >
        <span class="door-glyph" aria-hidden="true"></span>
        <span class="door-verb">Buscar </span>
        <span class="door-label">Acervo <span class="atlas-arrow" aria-hidden="true">↗</span></span>
      </a>
    </nav>
  </div>
</header>
