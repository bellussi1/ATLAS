<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" aria-label="ATLAS, página inicial" appHomeLink (click)="close()">
      <img class="brand__logo" src="/brand/atlas-logo.svg" alt="" width="140" height="40" />
    </a>
    <button
      #menuToggle
      type="button"
      class="menu-toggle atlas-press"
      aria-controls="navegacao-principal"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      <span class="menu-toggle__icon" aria-hidden="true"></span>
      <span>Menu</span>
    </button>
    <div id="navegacao-principal" class="panel" [class.is-open]="menuOpen()">
      <nav class="nav" aria-label="Navegação principal">
        <ul>
          <li>
            <a
              class="nav__link"
              routerLink="/leituras"
              title="Leituras contínuas por tema"
              [class.is-active]="section() === 'leituras'"
              [attr.aria-current]="section() === 'leituras' ? 'page' : null"
              (pointerenter)="warmReadings()"
              (focus)="warmReadings()"
              (click)="close()"
              ><span class="nav__glyph nav__glyph--quarter" aria-hidden="true"></span>Leituras</a
            >
          </li>
          <li>
            <a
              class="nav__link"
              routerLink="/itinerarios"
              title="Percursos guiados por perguntas"
              [class.is-active]="section() === 'itinerarios'"
              [attr.aria-current]="section() === 'itinerarios' ? 'page' : null"
              (click)="close()"
              ><span class="nav__glyph nav__glyph--half" aria-hidden="true"></span>Itinerários</a
            >
          </li>
          <li>
            <a
              class="nav__link"
              routerLink="/acervo"
              [queryParams]="{ camada: 'registros' }"
              [class.is-active]="section() === 'acervo'"
              [attr.aria-current]="section() === 'acervo' ? 'page' : null"
              (pointerenter)="warmArchive()"
              (focus)="warmArchive()"
              (click)="close()"
              ><span class="nav__glyph nav__glyph--square" aria-hidden="true"></span>Acervo</a
            >
          </li>
          <li>
            <a
              class="nav__link"
              routerLink="/grafos"
              [class.is-active]="section() === 'grafos'"
              [attr.aria-current]="section() === 'grafos' ? 'page' : null"
              (pointerenter)="warmGraph()"
              (focus)="warmGraph()"
              (click)="close()"
              ><span class="nav__glyph nav__glyph--circle" aria-hidden="true"></span>Grafo</a
            >
          </li>
          <li>
            <a
              class="nav__link"
              routerLink="/mapa"
              [class.is-active]="section() === 'mapa'"
              [attr.aria-current]="section() === 'mapa' ? 'page' : null"
              (pointerenter)="warmGraph()"
              (focus)="warmGraph()"
              (click)="close()"
              ><span class="nav__glyph nav__glyph--diamond" aria-hidden="true"></span>Mapa</a
            >
          </li>
          <li>
            <a class="nav__link" routerLink="/" fragment="como-usar" (click)="close()"
              ><span class="nav__glyph nav__glyph--half" aria-hidden="true"></span>Como usar</a
            >
          </li>
        </ul>
      </nav>
      <form class="search" role="search" aria-label="Busca no acervo" (submit)="search($event)">
        <label for="header-search" class="visually-hidden">Buscar no acervo</label>
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L21 21" />
        </svg>
        <input
          id="header-search"
          class="search__input"
          type="search"
          autocomplete="off"
          placeholder="Buscar no acervo…"
          [value]="query()"
          (input)="query.set($any($event.target).value)"
        />
        <button class="search__submit" type="submit">Buscar</button>
      </form>
    </div>
  </div>
</header>
