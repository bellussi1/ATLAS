<a
  class="skip-link"
  [routerLink]="[]"
  queryParamsHandling="preserve"
  [fragment]="'conteudo'"
  (click)="focusMainContent()"
>
  Pular para o conteúdo
</a>

@if (!fullscreen()) {
  <app-site-header />

  <app-breadcrumbs />
}

<main
  id="conteudo"
  tabindex="-1"
  [attr.aria-label]="failedNavigation() ? 'Falha de navegação' : pageTitle()"
>
  @if (failedNavigation(); as failure) {
    <app-navigation-failure
      [path]="failure"
      [kind]="failureKind()"
      [previousTitle]="previousTitle()"
      [retrying]="retrying()"
      (retry)="retryNavigation()"
      (dismiss)="dismissFailure()"
    />
  }
  <router-outlet />
</main>

@if (!fullscreen()) {
  <app-site-footer />
}
