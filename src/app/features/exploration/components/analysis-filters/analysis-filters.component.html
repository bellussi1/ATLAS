<form
  #filters
  aria-label="Filtros de exploração"
  (submit)="$event.preventDefault(); apply(filters)"
>
  <label
    >Coleção
    <select name="colecao">
      <option value="" [selected]="!value().collection">Todas as coleções</option>
      @if (unknownCollection()) {
        <option [value]="value().collection" [selected]="true">Coleção indisponível</option>
      }
      @for (atlas of graph().atlases; track atlas.id) {
        <option [value]="atlas.id" [selected]="value().collection === atlas.id">
          {{ atlas.title }}
        </option>
      }
    </select>
  </label>
  <label
    >Tipo de entidade
    <select name="tipo">
      <option value="" [selected]="!value().kind">Todos os tipos</option>
      @if (value().kind && !kinds().includes(value().kind)) {
        <option [value]="value().kind" [selected]="true">Tipo indisponível</option>
      }
      @for (kind of kinds(); track kind) {
        <option [value]="kind" [selected]="value().kind === kind">
          {{ kindLabels[kind] ?? kind }}
        </option>
      }
    </select>
  </label>
  <label
    >Natureza do vínculo
    <select name="relacao">
      <option value="" [selected]="!value().relation">Todos os vínculos</option>
      @if (value().relation && !relations().includes(value().relation)) {
        <option [value]="value().relation" [selected]="true">Vínculo indisponível</option>
      }
      @for (kind of relations(); track kind) {
        <option [value]="kind" [selected]="value().relation === kind">
          {{ relationLabels[kind] ?? kind }}
        </option>
      }
    </select>
  </label>
  <label
    >A partir do ano
    <input name="de" type="number" step="1" min="-100000" max="100000" [value]="value().from"
  /></label>
  <label
    >Até o ano
    <input name="ate" type="number" step="1" min="-100000" max="100000" [value]="value().to"
  /></label>
  <label class="check"
    ><input name="semData" type="checkbox" [checked]="value().includeUndated" /> Incluir registros
    sem data</label
  >
  <button type="submit">Aplicar filtros</button>
  <button type="button" (click)="cleared.emit()">Limpar filtros e seleção</button>
</form>
@if (value().error; as error) {
  <p role="alert">{{ error }}</p>
}
<p class="filter-note">
  O período filtra os anos conhecidos das entidades, não a data dos vínculos. Um extremo ausente não
  significa continuidade até hoje. O filtro de vínculo exige as duas entidades visíveis.
</p>
