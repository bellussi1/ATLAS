<ng-content select="[readingOpening]" />
<div class="reading-layout">
  <app-ideology-reading-index
    [sections]="sections()"
    [active]="active()"
    [tone]="tone()"
    [progress]="progress()"
    [reducedMotion]="reduced()"
    [hasPrevious]="!!previous()"
    (chapterSelected)="go($event)"
    (previousRequested)="returnToPrevious()"
    (motionToggleRequested)="toggleMotion()"
  />
  <div class="chapter-sequence"><ng-content /></div>
</div>
