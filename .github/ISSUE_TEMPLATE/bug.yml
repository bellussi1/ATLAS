name: Problema na interface
description: Algo quebrado, inacessível ou confuso
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Página
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir e o que esperava
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Navegador e dispositivo
